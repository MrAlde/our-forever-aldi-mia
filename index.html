ng penting, aku gak butuh kamu jadi sempurna. Aku cuma butuh kamu tetap jadi Mia yang aku kenal dan aku sayang.\nKalau kamu tanya kenapa harus kamu?\nYa karena aku maunya kamu, Sayang. Bukan yang lain. ❤️.</div>','<button id="giftMusic" onclick="toggleMusic()">♫ Putar / Jeda</button><p>♡</p>','<video controls playsinline src="assets/memory.MOV"></video><p></p>'];let unlocked=false;function render(){if(!unlocked){showGate();return;}if(step>=4){renderFinal();return;}let p=pages[step];app.innerHTML=`<small>ALDI & MIA · OUR FOREVER</small><div class="progress"><i style="width:${(step+1)/8*100}%"></i></div><section class="panel"><span class="symbol">${p[0]}</span><small>${p[2]}</small><h1>${p[1]}</h1><p>${p[3]}</p>${step===2?`<div class="gift">${gifts.map((g,i)=>`<button class="gift-box ${opened.has(i)?'opened':''}" onclick="gift(${i})" aria-label="${g}${opened.has(i)?', sudah dibuka':''}"><span class="present">${opened.has(i)?giftIcons[i]:'🎁'}</span><span>${g}</span><span class="gift-status">${opened.has(i)?'♥ Sudah dibuka':'Tap to open ♡'}</span></button>`).join('')}</div><p class="gift-count" aria-live="polite">${opened.size} dari 5 kejutan sudah dibuka</p><div id="surprise" style="margin-top:20px"></div>${opened.size===5?'<p class="gift-done">Udah di buka semuanya? Sekarang siap-siap untuk makin sayang sama aku.❤️</p>':''}`:''}<button onclick="next()" ${step===2&&opened.size<5?'disabled aria-disabled="true"':''}>${p[4]}</button>${step>0&&step<5?'<br><button onclick="step--;render()">← Kembali</button>':''}</section>`}function next(){if(step===2&&opened.size<5)return;step++;render();window.scrollTo(0,0)}function gift(i){const fresh=!opened.has(i);opened.add(i);render();if(fresh){for(let k=0;k<12;k++)petal(true);document.querySelectorAll(".gift-box")[i].classList.add("just-opened");}document.querySelector('#surprise').innerHTML='<h2>'+gifts[i]+'</h2>'+content[i];if(i===3)syncMusic();if(i===1){let a=document.querySelector('#photos');for(let j=1;j<=4;j++){let im=new Image();im.className='photo';im.alt='Kenangan '+j;im.src='assets/photo'+j+'.jpg';im.onerror=()=>{let d=document.createElement('div');d.className='placeholder';d.textContent='Foto kenangan '+j+' — tambahkan photo'+j+'.jpg';im.replaceWith(d)};a.append(im)}}}function petal(extra=false){let s=document.createElement('span');s.className='rose';s.textContent=extra?'♥':'❋';s.style.left=Math.random()*100+'%';s.style.fontSize=12+Math.random()*20+'px';s.style.animationDuration=5+Math.random()*9+'s';s.style.animationDelay=(extra?0:-Math.random()*10)+'s';document.body.append(s);if(extra)setTimeout(()=>s.remove(),14000)}function showGate(){app.innerHTML=`<section class="panel gate"><div class="lock-icon" aria-hidden="true">🔒</div><small>PRIVATE LOVE STORY</small><h1>Only for You, Mia</h1><p></p><form id="gateForm"><label for="pass" class="hint">Tanggal spesial kita</label><br><div class="heart-entry"><span class="heart-slot" aria-hidden="true">♡</span><span class="heart-slot" aria-hidden="true">♡</span><span class="heart-slot" aria-hidden="true">♡</span><span class="heart-slot" aria-hidden="true">♡</span><span class="heart-slot" aria-hidden="true">♡</span><span class="heart-slot" aria-hidden="true">♡</span><input id="pass" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="off" aria-label="Tanggal jadian, enam angka"></div><button type="submit">Masuk sini, calon istriku ♡</button><div id="message" role="status" aria-live="polite"></div></form><p class="hint"></p></section>`;const pass=document.querySelector('#pass');const syncHearts=()=>{pass.value=pass.value.replace(/[^0-9]/g,'').slice(0,6);document.querySelectorAll('.heart-slot').forEach((h,i)=>{h.textContent=i<pass.value.length?'♥':'♡';h.classList.toggle('filled',i<pass.value.length)})};pass.addEventListener('input',syncHearts);document.querySelector('#gateForm').addEventListener('submit',e=>{e.preventDefault();const v=document.querySelector('#pass');const m=document.querySelector('#message let scenes=[`<small>✦ THE FINAL CHAPTER ✦</small><h1>If I Could Tell You One Last Thing</h1><p></p><div class="final-letter"><p>Untuk perempuan kesayanganku, Mia ♡</p><p>Sayang, aku harap waktu kamu membaca surat ini, kamu lagi senyum. Karena dari awal aku bikin semua ini, cuma satu yang aku pengen: melihat kamu bahagia.</p><p>Aku mungkin gak selalu bisa ngasih kamu kejutan, bunga, atau hadiah mahal. Tapi aku pengen kamu tahu, ada seseorang yang selalu mikirin kamu, bahkan di tengah kesibukannya. Seseorang yang diam-diam selalu menyelipkan nama kamu di setiap rencana masa depannya.</p><p>Aku suka membayangkan kita beberapa tahun lagi. Mungkin nanti kita bakal ketawa sambil mengingat betapa lucunya kita dulu berjuang melawan jarak, dan betapa banyaknya hal yang akhirnya berhasil kita lewati bersama.</p><p>Aku pengen kita punya cerita seperti itu.</p><p>Aku pengen suatu hari nanti, ketika kamu melihat aku, kamu bisa bilang, Ternyata aku gak salah memilih kamu.</p><p>Dan aku juga bisa bilang, Untung waktu itu aku gak berhenti memperjuangkan kamu.</p><p>Sayang, enam bulan ini mungkin masih awal dari perjalanan kita. Masih banyak hal yang belum kita lakukan, tempat yang belum kita datangi, dan kenangan yang belum kita buat.</p><p>Jadi, jangan bosan sama aku dulu ya. Aku masih punya banyak cinta yang belum sempat aku kasih ke kamu.</p><p>Happy 6 months, perempuan kesayanganku.</p><p>Kalau suatu hari nanti kita sudah tua dan kamu lupa bagaimana aku mencintaimu hari ini, buka lagi surat kecil ini. Semoga kamu ingat, pernah ada seorang Aldi yang sebahagia ini karena memiliki seorang Mia.</p><p>I love you, sayang. ❤️</p><p><strong>Your favorite boy,

`<small>✦ UNDER THE SAME SKY ✦</small><h1>My Wish Is You</h1>${heart}<p>Sayang, kalau malam ini kamu lihat bintang, coba lihat langit sebentar. Di tempat aku sekarang, aku juga bisa melihat langit yang sama. Lucu ya, kita sejauh ini, tapi masih punya langit yang bisa kita lihat bareng.</p><p>Kalau aku dikasih satu permintaan malam ini, aku gak mau minta apa" selain bisa segera ketemu kamu. Aku pengen meluk kamu, lihat senyum kamu secara langsung, dan bilang kalau aku sayang banget sama kamu.</p><p>Dan kalau boleh minta satu lagi... semoga kamu jadi orang yang aku peluk setiap malam, bukan cuma orang yang aku telepon sebelum tidur. ♡</p><button onclick="advanceFinal()">Make a wish with me, Sayang ✨</button>`,
`<small>ONE LAST QUESTION</small><div class="heart">♡</div><h1>Mia, will you be my forever?</h1><p>Bukan hanya hari ini, bukan hanya di hari anniversary kita. Aku ingin terus berjalan bersamamu, melewati semua hari yang belum kita kenal.</p><button onclick="advanceFinal()">Yes, Always ❤️</button><button onclick="advanceFinal()">In Every Lifetime 💍</button><p style="font-size:13px;color:#dfb4c5">Sebuah harapan kecil dari Aldi, untuk kita.</p>`,
`<canvas id="fireworks" aria-hidden="true"></canvas><small>OUR FOREVER · THE END</small><div class="heart">♥</div><h1>Happy Anniversary, My Love!</h1><div class="final-photo-frame"><img class="final-photo" src="assets/ending.jpg" alt="Foto kenangan Aldi dan Mia" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="placeholder" hidden>♡<br>Tempat foto Aldi & Mia<br><small style="letter-spacing:0">assets/ending.jpg</small></div></div><p></p><div class="signature">Aldi ♡ Mia</div><p class="date">11 MEI 2026 · FOREVER</p><p>Jarak hanyalah sebuah bab. Semoga masa depan kita adalah halaman-halaman indah yang kita tulis bersama.</p><button onclick="startFireworks()">Rayakan sekali lagi ✨</button><button class="quiet" onclick="step=0;finaleStage=0;cancelAnimationFrame(fireRAF);render();window.scrollTo(0,0)">Baca dari awal</button>`];
